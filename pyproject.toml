[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "product-media-pipeline"
version = "1.0.0"
description = "Normalize product imagery, detect duplicates and produce auditable manifests"
requires-python = ">=3.10"
dependencies = ["Pillow>=11,<13"]

[project.scripts]
product-media = "media_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
