name: CI
on: [push, pull_request]
jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - run: python scripts/generate_demo_assets.py
      - run: python -m media_pipeline.cli examples/input generated
